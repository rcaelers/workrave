[package]
name = "ship"
version = "0.1.0"
edition = "2021"
description = "Workrave CI/CD tools (Rust port)"
authors = ["Rob Caelers"]
license = "MIT"

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.148.0", default-features = false, features = [
  "rt-tokio",
  "rustls",
] }
aws-smithy-runtime-api = "1.16.2"
aws-smithy-types = "1.6.4"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
git2 = { version = "0.21.0", default-features = false }
glob = "0.3"
indexmap = { version = "2.14.2", features = ["serde"] }
minijinja = { version = "2.24.0", features = [
  "loader",
  "json",
  "loop_controls",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "multipart",
] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9"
textwrap = { version = "0.16.4", default-features = false }
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "fs",
  "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[profile.release]
lto = "thin"
strip = true
