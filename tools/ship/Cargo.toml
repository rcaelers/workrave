[package]
name = "ship"
version = "0.1.0"
edition = "2021"
description = "Workrave CI/CD tools (Rust port)"
authors = ["Rob Caelers"]
license = "MIT"

[[bin]]
name = "ship"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
aws-config = { version = "1.10.1", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
] }
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.140.0", default-features = false, features = [
  "rt-tokio",
  "rustls",
] }
aws-smithy-runtime-api = "1.14.0"
aws-smithy-types = "1.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
git2 = { version = "0.21.0", default-features = false }
minijinja = { version = "2.21.0", features = [
  "loader",
  "json",
  "loop_controls",
] }
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls",
  "json",
] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9"
textwrap = { version = "0.16", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
